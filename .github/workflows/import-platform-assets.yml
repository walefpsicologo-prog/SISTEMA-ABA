name: Internalize platform public assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-platform-assets.yml'
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved clean public assets
        run: |
          set -euo pipefail
          mkdir -p platform/assets/media
          curl --fail --location --retry 3 'https://walef-teixeira.vercel.app/media/walef-hero.avif' -o platform/assets/media/walef-hero.avif
          curl --fail --location --retry 3 'https://walef-teixeira.vercel.app/media/tea-rio.avif' -o platform/assets/media/tea-rio.avif
          test -s platform/assets/media/walef-hero.avif
          test -s platform/assets/media/tea-rio.avif
      - name: Commit assets into official repository
        run: |
          git config user.name 'WT Platform Automation'
          git config user.email 'walefpsicologo@gmail.com'
          git add platform/assets/media/walef-hero.avif platform/assets/media/tea-rio.avif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: store approved platform media locally'
          git push
